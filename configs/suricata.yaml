%YAML 1.1
---
vars:
  address-groups:
    HOME_NET: "[208.100.26.166,192.168.0.0/16,10.0.0.0/8]"
    EXTERNAL_NET: "any"

af-packet:
  - interface: ens33
    cluster-id: 99
    cluster-type: cluster_flow
    defrag: yes

outputs:
  - fast:
      enabled: yes
      filename: fast.log
      append: yes
  - eve-log:
      enabled: yes
      filetype: regular
      filename: eve.json
      types:
        - alert:
            payload: yes
            payload-printable: yes
            packet: yes
            http-body: yes
        - http:
            extended: yes
        - dns
        - drop
        - flow

default-rule-path: /var/lib/suricata/rules

rule-files:
  # - suricata.rules
  - local.rules
